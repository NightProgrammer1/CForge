name: C++ Compiler CI & Test Suite

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 nasm gcc

      - name: Configure CMake
        run: cmake -B build -S CForge -DCMAKE_BUILD_TYPE=Release

      - name: Build Compiler
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: python3 CForge/tests/test_runner.py
